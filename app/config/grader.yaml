# Tax Return Grader - every threshold, weight, and band lives here.
# Edit freely; nothing in the code is hard-coded. Amounts are in dollars.
# After editing, re-run the grader. The report shows which rule fired and why.

# ---------------------------------------------------------------- bands
bands:
  aum:                 # AUM score 0-100 -> fit level
    high: 60
    med: 30            # below med -> low
  grades:              # Annuity and Life points -> letter grade
    A: 70
    B: 50
    C: 35
    D: 20              # below D -> F

# ---------------------------------------------------------------- AUM (points add up, capped)
aum:
  cap: 100
  agi:                          # Form 1040 line 11 / 11a. Highest tier reached counts.
    tiers: [[150000, 15], [250000, 20], [500000, 25]]
  invest_income:                # dividends (3b) + capital gains (7)
    tiers: [[5000, 15], [25000, 20]]
  interest:                     # taxable interest (2b); $2k at ~4% is ~$50k in cash
    tiers: [[2000, 10], [10000, 15]]
  retirement_distribution:      # any IRA/401k/pension distribution (4a/5a or a 1099-R)
    points: 15
  rollover:                     # 1099-R code G at or above min; REPLACES retirement_distribution
    min: 100000
    points: 25
  inheritance:                  # 1099-R code 4, or dividends >= multiple x prior year
    points: 15
    dividend_multiple: 3
    min_current_dividends: 2000 # ignore jumps from tiny amounts (e.g. $10 -> $40)
  asset_sale:                   # home or business sale gain (8949 rows / Sch D line 10 / 1099-S)
    min_gain: 100000
    points: 20
  niit:                         # Form 8960 line 17 or Schedule 2 line 12 > 0
    points: 10
  stock_comp_amt:               # Form 3921/3922 present, or AMT (Form 6251 line 11 > 0)
    points: 10
  no_retirement_savings:
    min_income: 100000
    # income used for the test: "earned" = W-2 wages + Schedule C net + S-corp K-1 box 1; or "agi"
    income_basis: earned
    deferral_codes: [D, E, F, G, S, AA, BB]   # W-2 box 12 codes that count as saving
    points: 10
  income_drop:                  # needs a prior-year return
    min_drop_pct: 40            # AGI fell by at least this much ...
    early_retirement_max_age: 64   # ... or wages went from >0 to 0 with the older spouse at/under this age
    points: 10
  early_withdrawal:             # 1099-R code 1, or Form 5329 Part I additional tax
    points: 10

# ---------------------------------------------------------------- Annuity (points -> grade)
annuity:
  age:                          # oldest of taxpayer/spouse at 12/31 of the tax year
    tiers: [[55, 25], [65, 30]]
  pension_ira_income:           # taxable IRA (4b) + pension (5b) > 0
    points: 20
  interest:
    tiers: [[2000, 15], [10000, 25]]
  bracket_24:                   # taxable income (line 15) at or above the start of the 24% bracket
    points: 10
    start:
      2025: {single: 103350, mfj: 206700, mfs: 103350, hoh: 103350, qss: 206700}
      2024: {single: 100525, mfj: 201050, mfs: 100525, hoh: 100500, qss: 201050}
  transition:                   # any one: SS started, rollover, widowhood, income drop
    points: 15
  rmd_age:                      # age at or above, with IRA distributions (4a > 0)
    age: 73
    points: 10

# ---------------------------------------------------------------- Life (points -> grade)
life:
  dependents:
    base: 25
    per_dependent: 5
    max_counted: 3
  single_earner:                # married filing jointly; one spouse has >= share of earned income
    share: 0.80
    points: 20
  business_owner:               # Schedule C net or S-corp K-1 box 1 at or above min
    min: 50000
    points: 20
  income:                       # AGI
    tiers: [[150000, 15], [300000, 20]]
  life_event:                   # marriage, new baby, divorce, widowhood (counted once)
    points: 15
  age_over:                     # oldest person strictly older than this
    age: 75
    points: -20

# ---------------------------------------------------------------- validation
validation:
  tolerance: 1                  # dollars of rounding allowed when comparing figures

# ---------------------------------------------------------------- how results are shown
# Plain-English verdicts shown instead of bare scores/letters.
display:
  verdicts:
    aum: {high: "Strong fit", med: "Worth a conversation", low: "Low priority"}
    grades: {A: "Strong fit", B: "Good fit", C: "Worth a conversation", D: "Low priority", F: "Not a fit"}
  product_names: {aum: "Investment management", annuity: "Annuity", life: "Life insurance"}
  max_points_per_product: 3    # talking points shown per product in the brief
  opener_points: 3             # items in the "what stood out" opening
  # Client-written notes and intake answers (when the documents include them) are shown in the
  # brief as written. A note is also attached to the first talking point whose topic it mentions.
  # Notes never change a score.
  note_links:
    retirement:
      keywords: ["401(k)", "403(b)", "ira", "roth", "pension", "retire", "retired", "rmd"]
      groups: [aum.no_retirement_savings, aum.retirement_distribution, aum.rollover, aum.early_withdrawal,
               annuity.pension_ira_income, annuity.rmd_age, annuity.age, aum.agi]
    cash:
      keywords: ["cd", "cds", "savings", "money market", "credit union", "cu", "bank account"]
      groups: [aum.interest, annuity.interest]
    investments:
      keywords: ["brokerage", "stock", "stocks", "fund", "funds", "bond", "dividend", "etf"]
      groups: [aum.invest_income, aum.niit, aum.stock_comp_amt, aum.interest]
    family:
      keywords: ["husband", "wife", "spouse", "passed", "lost my", "died", "widow", "divorce", "married", "baby"]
      groups: [life.life_event, annuity.transition, annuity.age, life.single_earner]
    children:
      keywords: ["child", "children", "daycare", "kids", "college"]
      groups: [life.dependents]
    home:
      keywords: ["home", "house", "roof", "mortgage"]
      groups: [aum.asset_sale]
  # Facts from the preparer's pages (tax rates, state return, Form 2441), when the documents include
  # them. Shown under the first matching talking point and in the "Tax picture" strip. Never scored.
  # Placeholders: {federal_marginal} {federal_effective} {state_name} {state_tax} {state_marginal}
  #               {care_paid} {care_provider} {care_benefits}
  context_lines:
    tax_rate:
      text: "Preparer's summary: {federal_marginal}% federal marginal rate, {federal_effective}% effective."
      groups: [annuity.bracket_24, aum.niit, aum.invest_income, aum.interest, annuity.interest, aum.agi, life.income,
               annuity.pension_ira_income]
    state_tax:
      text: "Lives in {state_name}: {state_tax} of state income tax ({state_marginal}% marginal), so state-tax-free income is worth more."
      groups: [aum.interest, annuity.interest, aum.invest_income, aum.niit]
    child_care:
      text: "Pays {care_paid} a year for child care ({care_provider}, Form 2441), a cost that continues if an income stops."
      groups: [life.dependents, life.single_earner]
    business_books:
      text: "Their own books ({pnl_business} P&L) show {pnl_net} of net income on {pnl_income} of sales."
      groups: [life.business_owner, aum.no_retirement_savings, life.single_earner, life.dependents, life.income]
    equipment_purchase:
      text: "Bought {asset_desc} for {asset_price} on {asset_date}{asset_financed_note}: a business that is investing in itself."
      groups: [life.business_owner, aum.no_retirement_savings, life.single_earner, life.dependents, life.income]

# ---------------------------------------------------------------- conversation brief
# One entry per signal (the part of the signal id before the threshold, e.g. aum.rollover).
# A full signal id (e.g. annuity.age_65) overrides its group for that tier.
#   headline: what you noticed, in the client's terms
#   why:      why it matters to them (one sentence)
#   ask:      a discovery question to open the topic (leave "" to skip)
# Placeholders: {value} the triggering amount/age, {detail} the specifics, {year} the tax year.
conversation:
  aum.rollover:
    headline: "Rolled {value} out of a workplace plan in {year}"
    why: "Money that just left a 401(k) often lands in cash or a default fund with no plan behind it."
    ask: "Where did the rollover land, and how is it invested today?"
  aum.retirement_distribution:
    headline: "Drawing {value} from retirement accounts"
    why: "Which accounts you draw from, and when, drives your taxes for years."
    ask: "Is this a regular draw or a one-time need? Is there a withdrawal plan?"
  aum.inheritance:
    headline: "Signs of an inherited account"
    why: "{detail}. Inherited IRAs come with distribution deadlines and usually no plan."
    ask: "Did you inherit an account recently? Who is helping you manage it?"
  aum.asset_sale:
    headline: "Large sale gain of {value}"
    why: "From the sale of {detail}. Proceeds like this often sit in cash waiting for a plan."
    ask: "What's the plan for the proceeds? Any near-term needs for that money?"
  aum.interest:
    headline: "{value} of interest income"
    why: "That points to a sizable savings or CD balance that may be earning less than it could."
    ask: "How much do you keep in savings and CDs, and what is it set aside for?"
  aum.invest_income:
    headline: "{value} in dividends and capital gains"
    why: "There's a taxable portfolio here worth reviewing for tax efficiency."
    ask: "Who manages your brokerage account today, and how do you decide what to sell?"
  aum.niit:
    headline: "Paying {value} of net investment income tax"
    why: "Where investments are held, and what they hold, can reduce this extra 3.8% tax."
    ask: "Has anyone looked at your investments with taxes in mind?"
  aum.stock_comp_amt:
    headline: "Equity compensation"
    why: "{detail}. Company stock can quietly become a large, concentrated position."
    ask: "How much of your net worth is in company stock, and is there a plan for selling it?"
  aum.no_retirement_savings:
    headline: "High earner with no retirement contributions on the return"
    why: "With {value} of earned income, a 401(k), SEP or solo 401(k) could cut taxes now and build savings."
    ask: "Are you saving for retirement anywhere that doesn't show up on the return?"
  aum.income_drop:
    headline: "Income dropped this year"
    why: "{detail}. Lower-income years are a window for Roth conversions and income planning."
    ask: "What changed this year? Is this the start of retirement?"
  aum.early_withdrawal:
    headline: "Early retirement withdrawal of {value}"
    why: "It came with a 10% penalty, which can signal a cash squeeze. An old 401(k) may still sit at a former employer."
    ask: "What prompted the withdrawal? Do you still have an account at a former employer?"
  aum.agi:
    headline: "Household income of {value}"
    why: "There's room to invest beyond workplace plans, and taxes are worth planning around."
    ask: "What happens with the money left over after your workplace savings?"
  annuity.age:
    headline: "Age {value}: approaching or in retirement"
    why: "This is when guaranteed income and protecting savings move up the list."
    ask: "When do you want to stop working, and what will replace the paycheck?"
  annuity.age_65:
    headline: "Age {value}: in retirement"
    why: "Making savings last, and guaranteeing income for life, become the priorities."
    ask: "Does your guaranteed income cover your monthly essentials? How long does your savings need to last?"
  annuity.pension_ira_income:
    headline: "Living partly on {value} of pension and IRA income"
    why: "Guaranteed lifetime income can cover the essentials no matter what markets do."
    ask: "Do your guaranteed income sources cover your basic monthly expenses?"
  annuity.interest:
    headline: "{value} of interest from savings and CDs"
    why: "Some CD money may earn more, tax-deferred, in a fixed or fixed-indexed annuity."
    ask: "When do your CDs mature, and what is that money for?"
  annuity.bracket_24:
    headline: "In the 24% tax bracket or higher"
    why: "With {value} of taxable income, growth that isn't taxed every year is worth more."
    ask: "Would you like more of your savings to grow without a yearly tax bill?"
  annuity.transition:
    headline: "Life transition: {detail}"
    why: "Changes like this are when income plans get rebuilt."
    ask: "How has this changed what you need your savings to do?"
  annuity.rmd_age:
    headline: "Taking required minimum distributions (age {value})"
    why: "RMDs set a floor on taxable income. Income planning and QCDs can help."
    ask: "Do you need your RMD to live on, or does it get reinvested?"
  life.dependents:
    headline: "{value} dependent(s) on the return"
    why: "Coverage should replace income and fund their future if something happens."
    ask: "If something happened to you, how would the family's costs be covered?"
  life.single_earner:
    headline: "One income supports the household"
    why: "{detail}. The family's plans depend on that paycheck continuing."
    ask: "How long would your family be OK if that income stopped?"
  life.business_owner:
    headline: "Business owner"
    why: "{detail}. Key-person and buy-sell coverage protect both the business and the family."
    ask: "Is there a buy-sell agreement, and is it funded?"
  life.income:
    headline: "Household income of {value}"
    why: "Coverage should keep pace with what the family would lose."
    ask: "When did you last review how much life coverage you have?"
  life.life_event:
    headline: "Life event: {value}"
    why: "{detail}. Beneficiaries and coverage usually need updating after a change like this."
    ask: "Have beneficiaries been updated since this change?"
  life.age_over:
    headline: "Age {value}"
    why: "New life coverage is usually less practical at this age; focus elsewhere."
    ask: ""
