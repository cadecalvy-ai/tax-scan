# Per the brief, the rules were not tuned to match. Decide each one: change a
# rule or weight in config/grader.yaml, or change the intended level in the
# answer key. Then delete the entry here. (Each listed case is an xfail(strict)
# test, so it starts "XPASS"-failing if a change makes it agree.)
