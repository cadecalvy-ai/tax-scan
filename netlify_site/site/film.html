<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Tax Scan · the film</title>
<meta name="description" content="The 24-second Tax Scan launch film.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%235b4cf0'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f6f7fb; --ink: #0e1020; --ink-2: #4a5068; --ink-3: #8a90a6; --line: #e3e5ee; --card-solid: #fff;
  --accent: #5b4cf0; --accent-2: #8b5cf6; --glow: rgba(91,76,240,.22);
  --shadow: 0 1px 2px rgba(14,16,32,.04), 0 24px 60px -24px rgba(40,36,110,.28);
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0a0b14; --ink: #eef0fb; --ink-2: #aab0c8; --ink-3: #6f7590; --line: #23263a; --card-solid: #14162a;
          --glow: rgba(139,92,246,.30); --shadow: 0 1px 2px rgba(0,0,0,.4), 0 30px 70px -30px rgba(0,0,0,.7); }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--ink);
       font: 16px/1.55 ui-sans-serif, -apple-system, "Segoe UI Variable Text", "Segoe UI", Inter, Roboto, system-ui, sans-serif;
       -webkit-font-smoothing: antialiased; }
a { color: inherit; }
.nav { width: 100%; max-width: 1120px; margin: 0 auto; padding: 22px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -.01em; text-decoration: none; font-size: 17px; }
.mark { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 10px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 6px 16px -6px var(--glow); }
main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px 16px 48px; text-align: center; }
.film { width: min(100%, 720px, calc(100vh - 290px)); min-width: min(100%, 300px); aspect-ratio: 1; border-radius: 28px; overflow: hidden;
        background: #0a0b14; border: 1px solid var(--line); box-shadow: var(--shadow); }
.film video { display: block; width: 100%; height: 100%; object-fit: cover; }
h1 { margin: 26px 0 0; font-size: clamp(24px, 4vw, 34px); letter-spacing: -.03em; line-height: 1.15; text-wrap: balance; }
p { margin: 8px 0 0; color: var(--ink-2); }
.actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 22px; }
.btn { border: 0; cursor: pointer; border-radius: 14px; padding: 13px 22px; font-weight: 600; font-size: 16px; display: inline-flex; align-items: center;
       gap: 8px; text-decoration: none; transition: transform .15s, box-shadow .2s; }
.btn:active { transform: translateY(1px) scale(.99); }
.btn.primary { color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 10px 24px -10px var(--glow); }
.btn.primary:hover { box-shadow: 0 14px 30px -10px var(--glow); }
.btn.ghost { background: var(--card-solid); border: 1px solid var(--line); }
.btn.ghost:hover { border-color: var(--accent); }
.btn:focus-visible, .brand:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
footer { padding: 18px 16px 28px; text-align: center; color: var(--ink-3); font-size: 13px; }
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
</head>
<body>
<header class="nav">
  <a class="brand" href="./">
    <span class="mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg></span>
    Tax Scan
  </a>
</header>

<main>
  <div class="film">
    <video id="film" controls playsinline loop preload="metadata" poster="launch-poster.jpg" aria-label="Tax Scan launch film, 24 seconds">
      <source src="launch.mp4" type="video/mp4">
    </video>
  </div>
  <h1>You log off at 6. Tax Scan doesn&rsquo;t.</h1>
  <p>Hand it the returns before bed. Read the results in the morning.</p>
  <div class="actions">
    <a class="btn primary" href="./">Scan now &rarr;</a>
    <a class="btn ghost" href="demo/index.html" id="sample">See the sample ranking</a>
  </div>
</main>

<footer>Illustrative film. Names and figures in it are fictional.</footer>
<script>
// the sample ranking only exists on the public demo site
fetch("demo/index.html", { method: "HEAD" }).then(r => { if (!r.ok) document.getElementById("sample").hidden = true; })
  .catch(() => { document.getElementById("sample").hidden = true; });
</script>
</body>
</html>
